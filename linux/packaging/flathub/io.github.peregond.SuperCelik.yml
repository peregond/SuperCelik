# Flathub-style manifest: builds the app from source (Flathub does not accept prebuilt binaries). Needs nuget-sources.json next to
# it (made by flatpak-dotnet-generator, see .github/workflows/flathub-check.yml). Here the source is the local checkout; in the
# Flathub repository replace the `dir` source of the supercelik module with:
#   - type: git
#     url: https://github.com/peregond/SuperCelik.git
#     tag: v<version>
#     commit: <full commit hash>
#     dest: src
app-id: io.github.peregond.SuperCelik
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: supercelik
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet8
build-options:
  append-path: /usr/lib/sdk/dotnet8/bin
  append-ld-library-path: /usr/lib/sdk/dotnet8/lib
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
finish-args:
  - --share=ipc
  - --socket=x11              # Avalonia runs through X11 (XWayland under Wayland)
  - --device=dri
  - --share=network           # only the check for a new version
  - --socket=pcsc             # the host's pcscd socket (Flatpak 1.15.x and later); the card reader is handled by the host service
modules:
  - name: pcsc-lite           # only the client library libpcsclite.so.1, the daemon runs on the host
    config-opts:
      - --disable-libudev
      - --disable-libsystemd
      - --disable-polkit
      - --disable-libusb
      - --disable-documentation
      - --disable-static
    cleanup:
      - /bin
      - /sbin
      - /include
      - /lib/pkgconfig
      - /lib/systemd
      - /share/man
      - '*.la'
    sources:
      - type: git
        url: https://github.com/LudovicRousseau/PCSC.git
        tag: 2.3.3

  - name: supercelik
    buildsystem: simple
    build-options:
      env:
        SC_VERSION: 0.9.10      # keep in step with <Version> in SerbiaID.Linux.csproj
      arch:
        x86_64: { env: { RID: linux-x64 } }
        aarch64: { env: { RID: linux-arm64 } }
    build-commands:
      - >-
        cd src && dotnet publish linux/SerbiaID.Linux -c Release -r $RID --self-contained
        --source ../nuget-sources -p:Version=$SC_VERSION -p:DebugType=None -o /app/lib/supercelik
      - chmod 755 /app/lib/supercelik/SuperCelik
      - mkdir -p /app/bin && ln -s ../lib/supercelik/SuperCelik /app/bin/supercelik
      - install -Dm644 packaging/io.github.peregond.SuperCelik.desktop /app/share/applications/io.github.peregond.SuperCelik.desktop
      - install -Dm644 src/linux/SerbiaID.Linux/Assets/icon.png /app/share/icons/hicolor/256x256/apps/io.github.peregond.SuperCelik.png
      - install -Dm644 packaging/io.github.peregond.SuperCelik.metainfo.xml /app/share/metainfo/io.github.peregond.SuperCelik.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        dest: src
      - nuget-sources.json
      - type: file
        path: io.github.peregond.SuperCelik.desktop
        dest: packaging
      - type: file
        path: io.github.peregond.SuperCelik.metainfo.xml
        dest: packaging
