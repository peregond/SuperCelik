# Flatpak manifest. Built by scripts/make-linux-flatpak.sh, which first copies the already published self-contained app into
# ./publish, the desktop file, the icon and the metainfo next to this file in a work folder.
app-id: io.github.peregond.SuperCelik
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: supercelik
finish-args:
  - --share=ipc
  - --socket=x11              # Avalonia runs through X11 (XWayland under Wayland)
  - --device=dri
  - --share=network           # only the check for a new version
  - --socket=pcsc             # the host's pcscd socket (Flatpak 1.15.x and later); the card reader is handled by the host service
modules:
  - name: pcsc-lite           # only the client library libpcsclite.so.1, the daemon runs on the host
    config-opts:
      - --disable-libudev
      - --disable-libsystemd
      - --disable-polkit
      - --disable-libusb
      - --disable-documentation
      - --disable-static
    cleanup:
      - /bin
      - /sbin
      - /include
      - /lib/pkgconfig
      - /lib/systemd
      - /share/man
      - '*.la'
    sources:
      - type: git
        url: https://github.com/LudovicRousseau/PCSC.git
        tag: 2.3.3

  - name: supercelik
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/supercelik /app/bin
      - cp -a publish/. /app/lib/supercelik/
      - rm -rf /app/lib/supercelik/pkcs11      # the browser module cannot work from inside the sandbox
      - chmod 755 /app/lib/supercelik/SuperCelik
      - ln -s ../lib/supercelik/SuperCelik /app/bin/supercelik
      - install -Dm644 io.github.peregond.SuperCelik.desktop /app/share/applications/io.github.peregond.SuperCelik.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/io.github.peregond.SuperCelik.png
      - install -Dm644 io.github.peregond.SuperCelik.metainfo.xml /app/share/metainfo/io.github.peregond.SuperCelik.metainfo.xml
    sources:
      - type: dir
        path: publish
        dest: publish
      - type: file
        path: io.github.peregond.SuperCelik.desktop
      - type: file
        path: io.github.peregond.SuperCelik.metainfo.xml
      - type: file
        path: icon.png
