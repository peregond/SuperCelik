# Xcode project for the iOS app, generated with XcodeGen (brew install xcodegen):
#   cd ios && xcodegen generate && open SuperCelik.xcodeproj
# The .xcodeproj is not committed; CI generates it the same way.
#
# The card protocol, signature check, data model and the MUP print layout are the macOS
# app's own files from Sources/SerbiaID (listed below), so both apps run the same code.
name: SuperCelik
options:
  bundleIdPrefix: com.peregond
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SuperCelik:
    type: application
    platform: iOS
    sources:
      - path: SuperCelik
      - path: ../Sources/SerbiaID/CardModel.swift
      - path: ../Sources/SerbiaID/EidCard.swift
      - path: ../Sources/SerbiaID/Asn1.swift
      - path: ../Sources/SerbiaID/SignatureVerifier.swift
      - path: ../Sources/SerbiaID/TokenCodec.swift
      - path: ../Sources/SerbiaID/MupPrintLayout.swift
      - path: ../Sources/SerbiaID/Rows.swift
      - path: ../Sources/SerbiaID/Localization.swift
      - path: ../Sources/SerbiaID/Prefs.swift
      # MUP CA certificates, copied as <app>/CA (SignatureVerifier looks there). Not the whole
      # Resources folder: a top-level "Resources" directory makes codesign treat an iOS app as ambiguous.
      - path: ../Sources/SerbiaID/Resources/CA
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SuperCelik
        PRODUCT_BUNDLE_IDENTIFIER: com.peregond.supercelik.ios
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SuperCelik.entitlements
        CODE_SIGN_STYLE: Automatic
        # Set your own team here or in Xcode (Signing & Capabilities). NFC needs a paid team.
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad (iPads have no NFC reader: the app shows an explanatory banner)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
schemes:
  SuperCelik:
    build:
      targets:
        SuperCelik: all
    run:
      config: Debug
    archive:
      config: Release
