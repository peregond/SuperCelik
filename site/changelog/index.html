["1.4.9","2026-11-22",[
 [ALL,"Новые языки интерфейса: венгерский, албанский, словацкий, румынский (подходит и тем, кто говорит по-влашски), хорватский, украинский и белорусский. Язык выбирается в настройках; если языка в системе нет в списке, остаётся английский. Переводы сделаны без носителей языка: если заметите неточность, напишите нам.","New interface languages: Hungarian, Albanian, Slovak, Romanian (which also serves Vlach speakers), Croatian, Ukrainian and Belarusian. Pick the language in Settings; a system language that is not on the list falls back to English. The translations were made without native speakers: if you notice a mistake, tell us.","Novi jezici interfejsa: mađarski, albanski, slovački, rumunski (koji služi i govornicima vlaškog), hrvatski, ukrajinski i beloruski. Jezik se bira u podešavanjima; ako sistemski jezik nije na listi, ostaje engleski. Prevodi su rađeni bez izvornih govornika: ako primetite grešku, javite nam."],
]],
["1.4.8","2026-11-22",[
 [["windows","linux"],"Две кнопки про вход в браузере стали одной: «Настроить вход в браузере» сама подключает то, чего не хватает, и тут же показывает результат проверки (карта, драйвер или модуль, браузеры) и что делать дальше.","The two browser sign-in buttons are now one: “Set up browser sign-in” connects what is missing by itself and shows the check result right away (card, driver or module, browsers) with what to do next.","Dva dugmeta za prijavu u pregledaču sada su jedno: „Podesi prijavu u pregledaču“ samo povezuje ono što fali i odmah prikazuje rezultat provere (kartica, drajver ili modul, pregledači) i šta dalje."],
 [["windows","linux","android"],"Убрана техническая подсказка «Чтение токена не использует PIN…» под кнопками токена.","The technical note “Reading the token does not use the PIN…” under the token buttons is gone.","Uklonjena je tehnička napomena „Čitanje tokena ne koristi PIN…“ ispod dugmadi tokena."],
 [["windows"],"Кнопки на вкладке «Токен и сертификаты» больше не слипаются, когда переносятся на вторую строку.","The buttons on the Token and certificates tab no longer stick together when they wrap onto a second line.","Dugmad na kartici „Token i sertifikati“ više se ne lepe kada pređu u drugi red."],
]],
["1.4.7","2026-11-22",[
 [["windows"],"В Windows те же кнопки, что в Linux: «Войти на eUprava», «Настроить вход в браузере» и «Проверить вход в браузере» (карта, драйвер, Firefox и что делать дальше). В настройках можно включить демо-данные, в «О программе» есть кнопка «Сообщить об ошибке или оставить отзыв».","Windows now has the same buttons as Linux: “Sign in to eUprava”, “Set up browser sign-in” and “Check browser sign-in” (card, driver, Firefox and what to do next). Settings can show demo data, and About has a button to report a bug or leave feedback.","Windows sada ima ista dugmad kao Linux: „Prijava na eUpravu“, „Podesi prijavu u pregledaču“ i „Proveri prijavu u pregledaču“ (kartica, drajver, Firefox i šta dalje). U podešavanjima se mogu uključiti demo podaci, a u odeljku „O programu“ je dugme za prijavu greške ili povratnu informaciju."],
 [["android"],"Карта читается сама, как только её вставили в уже подключённый считыватель (как на компьютере и iPhone). Выключается в настройках: «Читать карту автоматически при вставке».","The card is read by itself as soon as it is put into an already connected reader (like on the desktop and iPhone). Turn it off in Settings: “Read the card automatically when inserted”.","Kartica se čita sama čim se stavi u već povezani čitač (kao na računaru i iPhone-u). Isključuje se u podešavanjima: „Automatski pročitaj karticu pri umetanju“."],
 [["android"],"Убрана настройка «Стирать данные автоматически через…»: данные и так показываются только на экране и исчезают, когда вы закрываете приложение или нажимаете «Очистить».","The “Clear data automatically after…” setting is gone: the data is only shown on screen and disappears when you close the app or tap Clear.","Uklonjeno je podešavanje „Automatski obriši podatke posle…“: podaci se prikazuju samo na ekranu i nestaju kada zatvorite aplikaciju ili dodirnete Očisti."],
 [["windows","linux","macos","ios"],"В сообщении об ошибке больше нет технической строки «Подробности: …» (коды карты и системы): она обычному пользователю ни к чему. Остаются понятный заголовок и что делать.","The error message no longer has the technical “Details: …” line (card and system codes): an ordinary user does not need it. The clear title and what to do stay.","U poruci o grešci više nema tehničkog reda „Detalji: …“ (kodovi kartice i sistema): običnom korisniku ne treba. Ostaju jasan naslov i šta da uradi."],
 [ALL,"В настройках появилась кнопка «Скопировать логи и ошибки»: она копирует технические сведения об ошибках (коды и сообщения, версию и систему, без ваших данных с карты), чтобы вставить их в сообщение об ошибке.","Settings has a new “Copy logs and errors” button: it copies the technical details of the errors (codes and messages, version and system, without your card data) so you can paste them into a bug report.","U podešavanjima je novo dugme „Kopiraj logove i greške“: kopira tehničke podatke o greškama (kodove i poruke, verziju i sistem, bez vaših podataka sa kartice) da ih nalepite u prijavu greške."],

 [["macos","linux"],"Подсказка под кнопкой «Войти на eUprava»: если браузер не предлагает карту, полностью закройте его и откройте страницу заново, затем выньте карту из ридера и вставьте снова. Кнопка «Проверить вход в браузере» показывает, что именно не так (нет карты в ридере, в macOS не зарегистрирован драйвер карты, в Linux модуль не подключён к браузеру, система не видит карту), и что сделать дальше.","A tip under the “Sign in to eUprava” button: if the browser does not offer the card, quit it completely and open the page again, then take the card out of the reader and put it back in. The “Check browser sign-in” button shows what exactly is wrong (no card in the reader, the card driver is not registered with macOS, the module is not connected to the browser on Linux, the system does not see the card) and what to do next.","Savet ispod dugmeta „Prijava na eUpravu“: ako pregledač ne nudi karticu, potpuno ga zatvorite i ponovo otvorite stranicu, pa izvadite karticu iz čitača i ponovo je umetnite. Dugme „Proveri prijavu u pregledaču“ pokazuje šta tačno nije u redu (nema kartice u čitaču, u macOS-u drajver kartice nije registrovan, u Linux-u modul nije povezan sa pregledačem, sistem ne vidi karticu) i šta dalje."],

 for(const [ver,date,items] of LOG){
  const rows=items.filter(it=>app==="all"||it[0].includes(app));
  if(!rows.length)continue;
  shown+=rows.length;
  const sec=document.createElement("section");sec.className="rel";
  const h=document.createElement("h2");h.append(ver==="next"?L(tx.next):ver);
  if(date){const t=document.createElement("time");t.dateTime=date;t.textContent=date;h.append(t)}
  sec.append(h);
  const ul=document.createElement("ul");
  for(const it of rows){
   const li=document.createElement("li");
   if(app==="all"&&it[0].length<ALL.length){const a=document.createElement("span");a.className="apps";
    it[0].forEach(k=>{const b=document.createElement("b");b.textContent=APPS[k];a.append(b)});li.append(a)}
   li.append(pick(it,lang));ul.append(li)}
  sec.append(ul);box.append(sec)}
 const em=document.getElementById("empty");em.hidden=shown>0;em.textContent=L(tx.empty);
}
function buildTabs(){
 const tx=T[lang],sc=lang==="sc",L=s=>sc?translitText(s):s;
 const box=document.getElementById("tabs");box.textContent="";
 [["all",L(tx.all)],...ALL.map(k=>[k,APPS[k]])].forEach(([k,label])=>{
  const b=document.createElement("button");b.type="button";b.textContent=label;b.setAttribute("aria-pressed",k===app);
  b.onclick=()=>{app=k;try{const u=new URL(location.href);k==="all"?u.searchParams.delete("app"):u.searchParams.set("app",k);history.replaceState(null,"",u)}catch(e){}buildTabs();build()};
  box.append(b)})}

function localizeMisc(l,title){
 document.querySelectorAll("[data-aria]").forEach(e=>e.setAttribute("aria-label",ARIA[l][e.dataset.aria]));
 document.getElementById("fpriv").textContent=FOOT[l].priv;
 const d=document.querySelector('meta[name="description"]');if(d)d.setAttribute("content",FOOT[l].d);
 const o=document.querySelector('meta[property="og:title"]');if(o)o.setAttribute("content",title)}
function setLang(l){lang=l;try{localStorage.setItem("sc-lang",l)}catch(e){}
 document.documentElement.lang={ru:"ru",en:"en",sr:"sr-Latn",sc:"sr-Cyrl"}[l]||l;
 const tx=T[l],L=s=>l==="sc"?translitText(s):s;
 document.getElementById("h1").textContent=L(tx.title);document.getElementById("lead").textContent=L(tx.lead);
 document.getElementById("disc").textContent=l==="sc"?"Super Čelik – независна апликација, није повезана са МУП РС нити NetSeT/Veridos.":tx.disc;
 document.title=L(tx.title)+" – Super Čelik";localizeMisc(l,document.title);
 buildTabs();build();
 document.querySelectorAll(".langmenu button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l))}
const lbox=document.getElementById("langbox"),globe=document.getElementById("globe");
const setOpen=o=>{lbox.classList.toggle("open",o);globe.setAttribute("aria-expanded",o)};
globe.onclick=e=>{e.stopPropagation();setOpen(!lbox.classList.contains("open"))};
document.addEventListener("click",e=>{if(!lbox.contains(e.target))setOpen(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){setOpen(false);globe.blur()}});
document.querySelectorAll(".langmenu button").forEach(b=>b.onclick=()=>{setLang(b.dataset.l);setOpen(false);b.blur();globe.blur()});
setLang(lang);
</script>
