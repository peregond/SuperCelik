.langbox{position:fixed;top:14px;right:16px;z-index:60}
.globe{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:border-color .2s}
.globe svg{width:21px;height:21px}
.globe:hover,.langbox.open .globe,.globe:focus-visible{border-color:var(--ink)}
.langmenu{position:absolute;right:0;top:100%;padding-top:8px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.96);transform-origin:top right;transition:opacity .18s,transform .18s,visibility .18s}
.langmenu .in{display:flex;flex-direction:column;min-width:200px;padding:6px;border-radius:16px;background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 18px 40px -18px rgba(0,0,0,.35)}
.langmenu button{display:flex;align-items:center;gap:12px;text-align:left;border:0;background:none;color:var(--ink);padding:10px 12px;border-radius:10px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.langmenu .in{max-height:calc(100vh - 96px);overflow-y:auto}
.langmenu .fl{width:26px;height:18px;border-radius:4px;flex:none;box-shadow:0 0 0 1px var(--line)}
.langmenu button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.langmenu button[aria-pressed=true]::after{content:"✓";color:var(--red);font-weight:800;margin-left:auto;padding-left:10px}
.langbox.open .langmenu,.langbox:focus-within .langmenu{opacity:1;visibility:visible;transform:none}
@media(hover:hover){.langbox:hover .langmenu{opacity:1;visibility:visible;transform:none}}
@media(max-width:480px){.langbox{top:10px;right:10px}}
.hero{padding:56px 0 8px;text-align:left}
.hero h1{max-width:720px;margin:0 auto;font-size:clamp(30px,5vw,48px);line-height:1.05;letter-spacing:-.035em;font-weight:800}
.hero p{max-width:720px;margin:14px auto 0;color:var(--muted);font-size:clamp(17px,2vw,21px);line-height:1.4}
.tabs{max-width:720px;margin:28px auto 0;display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:600 15px/1 inherit;font-family:inherit;border:1px solid var(--line);background:none;color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s}
.tabs button:hover{border-color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.log{max-width:720px;margin:12px auto 0;padding:0}
.rel{padding:26px 0 6px;border-top:1px solid var(--line);margin-top:22px}
.rel:first-child{border-top:0;margin-top:0}
.rel h2{display:flex;align-items:baseline;gap:14px;margin:0 0 10px;font-size:clamp(22px,3vw,28px);letter-spacing:-.02em;font-weight:800}
.rel h2 time{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.rel ul{list-style:none;margin:0;padding:0}
.rel li{padding:9px 0;font-size:17px;line-height:1.45}
.apps{display:inline-flex;flex-wrap:wrap;gap:6px;margin-right:10px;vertical-align:1px}
.apps b{font-size:12px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.empty{max-width:720px;margin:30px auto 0;color:var(--muted)}
footer{margin-top:64px;border-top:1px solid var(--line);padding:26px 0 44px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between}
@media(max-width:620px){body{font-size:17px}.wrap{padding:0 16px}.hero{padding-top:48px}}

["1.5.0","2026-11-24",[
 [["windows","linux","macos","ios"],"Список языков упорядочен: сербский (латиница и кириллица), английский, русский, дальше остальные по алфавиту. У каждого языка свой флаг (в Windows нарисованный картинкой, потому что шрифт эмодзи Windows флагов не рисует).","The language list is reordered: Serbian (Latin and Cyrillic), English, Russian, then the others alphabetically. Every language has its flag (drawn as a picture on Windows, because the Windows emoji font has no flags).","Spisak jezika je preuređen: srpski (latinica i ćirilica), engleski, ruski, pa ostali po abecedi. Svaki jezik ima svoju zastavu (na Windowsu nacrtanu kao sliku, jer Windows font za emodži nema zastave)."],
 [["android"],"Язык приложения выбирается прямо в настройках приложения (с флагами), без перехода в системные настройки, и меняется сразу. Работает на всех версиях Android, не только на 13 и новее.","The app language is chosen right in the app's Settings (with flags), without a trip to the system settings, and it changes at once. It works on every Android version, not only 13 and newer.","Jezik aplikacije se bira direktno u podešavanjima aplikacije (sa zastavama), bez odlaska u sistemska podešavanja, i menja se odmah. Radi na svim verzijama Androida, ne samo na 13 i novijim."],
]],
["1.4.9","2026-11-22",[
 [ALL,"Новые языки интерфейса: венгерский, албанский, словацкий, румынский, хорватский, украинский и белорусский. Язык выбирается в настройках; если языка в системе нет в списке, остаётся английский. Переводы сделаны без носителей языка: если заметите неточность, напишите нам.","New interface languages: Hungarian, Albanian, Slovak, Romanian, Croatian, Ukrainian and Belarusian. Pick the language in Settings; a system language that is not on the list falls back to English. The translations were made without native speakers: if you notice a mistake, tell us.","Novi jezici interfejsa: mađarski, albanski, slovački, rumunski, hrvatski, ukrajinski i beloruski. Jezik se bira u podešavanjima; ako sistemski jezik nije na listi, ostaje engleski. Prevodi su rađeni bez izvornih govornika: ako primetite grešku, javite nam.","Novi jezici sučelja: mađarski, albanski, slovački, rumunjski, hrvatski, ukrajinski i bjeloruski. Jezik se bira u postavkama; ako sistemski jezik nije na popisu, ostaje engleski. Prijevodi su rađeni bez izvornih govornika: ako primijetite pogrešku, javite nam.","Új felületi nyelvek: magyar, albán, szlovák, román, horvát, ukrán és belarusz. A nyelvet a Beállításokban választhatja; ha a rendszer nyelve nincs a listán, az angol marad. A fordításokat anyanyelvi beszélők nélkül készítettük: ha hibát talál, jelezze nekünk.","Gjuhë të reja të ndërfaqes: hungarisht, shqip, sllovakisht, rumanisht, kroatisht, ukrainisht dhe bjellorusisht. Gjuha zgjidhet te cilësimet; nëse gjuha e sistemit nuk është në listë, mbetet anglishtja. Përkthimet janë bërë pa folës amtarë: nëse vini re ndonjë gabim, na tregoni.","Nové jazyky rozhrania: maďarčina, albánčina, slovenčina, rumunčina, chorvátčina, ukrajinčina a bieloruština. Jazyk sa vyberá v nastaveniach; ak jazyk systému nie je v zozname, zostáva angličtina. Preklady vznikli bez rodených hovoriacich: ak si všimnete chybu, dajte nám vedieť.","Limbi noi de interfață: maghiară, albaneză, slovacă, română, croată, ucraineană și belarusă. Limba se alege în Setări; dacă limba sistemului nu este în listă, rămâne engleza. Traducerile au fost făcute fără vorbitori nativi: dacă observați o greșeală, spuneți-ne.","Нові мови інтерфейсу: угорська, албанська, словацька, румунська, хорватська, українська та білоруська. Мова вибирається в налаштуваннях; якщо мови системи немає в списку, лишається англійська. Переклади зроблено без носіїв мови: якщо помітите неточність, напишіть нам.","Новыя мовы інтэрфейсу: венгерская, албанская, славацкая, румынская, харвацкая, украінская і беларуская. Мова выбіраецца ў наладах; калі мовы сістэмы няма ў спісе, застаецца англійская. Пераклады зроблены без носьбітаў мовы: калі заўважыце недакладнасць, напішыце нам."],
]],
["1.4.8","2026-11-22",[
 [["windows","linux"],"Две кнопки про вход в браузере стали одной: «Настроить вход в браузере» сама подключает то, чего не хватает, и тут же показывает результат проверки (карта, драйвер или модуль, браузеры) и что делать дальше.","The two browser sign-in buttons are now one: “Set up browser sign-in” connects what is missing by itself and shows the check result right away (card, driver or module, browsers) with what to do next.","Dva dugmeta za prijavu u pregledaču sada su jedno: „Podesi prijavu u pregledaču“ samo povezuje ono što fali i odmah prikazuje rezultat provere (kartica, drajver ili modul, pregledači) i šta dalje.","Dva gumba za prijavu u pregledniku sada su jedan: „Podesi prijavu u pregledniku” sam povezuje ono što nedostaje i odmah prikazuje rezultat provjere (kartica, upravljački program ili modul, preglednici) i što dalje.","A két böngészős bejelentkezési gomb egy lett: a „Bejelentkezés beállítása a böngészőben” maga összeköti, ami hiányzik, és rögtön megmutatja az ellenőrzés eredményét (kártya, illesztőprogram vagy modul, böngészők), valamint hogy mi a teendő.","Dy butonat për hyrjen në shfletues tani janë një: „Cakto hyrjen në shfletues” lidh vetë atë që mungon dhe menjëherë shfaq rezultatin e kontrollit (karta, drejtuesi ose moduli, shfletuesit) me atë që duhet bërë më tej.","Dve tlačidlá na prihlásenie v prehliadači sú teraz jedno: „Nastaviť prihlásenie v prehliadači“ samo pripojí, čo chýba, a hneď zobrazí výsledok kontroly (karta, ovládač alebo modul, prehliadače) s tým, čo robiť ďalej.","Cele două butoane pentru autentificarea în browser sunt acum unul singur: „Configurează autentificarea în browser” conectează singur ce lipsește și arată imediat rezultatul verificării (card, driver sau modul, browsere) cu ce trebuie făcut mai departe.","Дві кнопки для входу в браузері тепер одна: «Налаштувати вхід у браузері» сама підключає те, чого бракує, і одразу показує результат перевірки (картка, драйвер або модуль, браузери) та що робити далі.","Дзве кнопкі для ўваходу ў браўзеры цяпер адна: «Наладзіць уваход у браўзеры» сама падключае тое, чаго не стае, і адразу паказвае вынік праверкі (карта, драйвер або модуль, браўзеры) і што рабіць далей."],
 [["windows","linux","android"],"Убрана техническая подсказка «Чтение токена не использует PIN…» под кнопками токена.","The technical note “Reading the token does not use the PIN…” under the token buttons is gone.","Uklonjena je tehnička napomena „Čitanje tokena ne koristi PIN…“ ispod dugmadi tokena.","Tehnička napomena „Čitanje tokena ne koristi PIN…” ispod gumba tokena je uklonjena.","A tokengombok alatti technikai megjegyzés, „A token olvasása nem használ PIN-kódot…”, eltűnt.","Shënimi teknik „Leximi i tokenit nuk përdor PIN…” nën butonat e tokenit është hequr.","Technická poznámka „Čítanie tokenu nepoužíva PIN…“ pod tlačidlami tokenu zmizla.","Nota tehnică „Citirea tokenului nu folosește PIN-ul…” de sub butoanele tokenului a dispărut.","Технічну примітку «Читання токена не використовує PIN…» під кнопками токена прибрано.","Тэхнічную заўвагу «Чытанне токена не выкарыстоўвае PIN…» пад кнопкамі токена прыбралі."],
 [["windows"],"Кнопки на вкладке «Токен и сертификаты» больше не слипаются, когда переносятся на вторую строку.","The buttons on the Token and certificates tab no longer stick together when they wrap onto a second line.","Dugmad na kartici „Token i sertifikati“ više se ne lepe kada pređu u drugi red.","Gumbi na kartici „Token i certifikati” više se ne lijepe kad prijeđu u drugi red.","A „Token és tanúsítványok” lap gombjai már nem tapadnak össze, amikor a második sorba törnek.","Butonat te skeda „Token dhe certifikata” nuk ngjiten më me njëri-tjetrin kur kalojnë në rreshtin e dytë.","Tlačidlá na karte „Token a certifikáty“ sa už nezlepujú, keď prejdú do druhého riadka.","Butoanele din fila „Token și certificate” nu se mai lipesc între ele când trec pe al doilea rând.","Кнопки на вкладці «Токен і сертифікати» більше не злипаються, коли переходять на другий рядок.","Кнопкі на ўкладцы «Токен і сертыфікаты» больш не злепліваюцца, калі пераходзяць на другі радок."],
]],
["1.4.7","2026-11-22",[
 [["windows"],"В Windows те же кнопки, что в Linux: «Войти на eUprava», «Настроить вход в браузере» и «Проверить вход в браузере» (карта, драйвер, Firefox и что делать дальше). В настройках можно включить демо-данные, в «О программе» есть кнопка «Сообщить об ошибке или оставить отзыв».","Windows now has the same buttons as Linux: “Sign in to eUprava”, “Set up browser sign-in” and “Check browser sign-in” (card, driver, Firefox and what to do next). Settings can show demo data, and About has a button to report a bug or leave feedback.","Windows sada ima ista dugmad kao Linux: „Prijava na eUpravu“, „Podesi prijavu u pregledaču“ i „Proveri prijavu u pregledaču“ (kartica, drajver, Firefox i šta dalje). U podešavanjima se mogu uključiti demo podaci, a u odeljku „O programu“ je dugme za prijavu greške ili povratnu informaciju.","Windows sada ima iste gumbe kao Linux: „Prijava na eUpravu”, „Podesi prijavu u pregledniku” i „Provjeri prijavu u pregledniku” (kartica, upravljački program, Firefox i što dalje). U postavkama se mogu uključiti demo podaci, a u „O programu” je gumb za prijavu pogreške ili povratnu informaciju.","A Windowson mostantól ugyanazok a gombok vannak, mint Linuxon: „Bejelentkezés az eUprávába”, „Bejelentkezés beállítása a böngészőben” és „Bejelentkezés ellenőrzése a böngészőben” (kártya, illesztőprogram, Firefox és a teendő). A Beállításokban demóadatok jeleníthetők meg, a Névjegyben pedig van gomb hibajelentéshez vagy visszajelzéshez.","Windows tani ka të njëjtat butona si Linux: „Hyr në eUprava”, „Cakto hyrjen në shfletues” dhe „Kontrollo hyrjen në shfletues” (karta, drejtuesi, Firefox dhe çfarë të bëhet më tej). Te cilësimet mund të shfaqen të dhëna demo, ndërsa te „Rreth programit” ka një buton për raportim gabimi ose koment.","Windows má teraz rovnaké tlačidlá ako Linux: „Prihlásiť sa do eUprava“, „Nastaviť prihlásenie v prehliadači“ a „Skontrolovať prihlásenie v prehliadači“ (karta, ovládač, Firefox a čo robiť ďalej). V nastaveniach sa dajú zobraziť ukážkové údaje a v „O aplikácii“ je tlačidlo na nahlásenie chyby alebo spätnú väzbu.","Windows are acum aceleași butoane ca Linux: „Autentificare la eUprava”, „Configurează autentificarea în browser” și „Verifică autentificarea în browser” (card, driver, Firefox și ce urmează). În Setări se pot afișa date demo, iar în „Despre” există un buton pentru raportarea unei erori sau pentru un comentariu.","У Windows тепер ті самі кнопки, що й у Linux: «Увійти на eUprava», «Налаштувати вхід у браузері» та «Перевірити вхід у браузері» (картка, драйвер, Firefox і що робити далі). У налаштуваннях можна показати демонстраційні дані, а в «Про програму» є кнопка, щоб повідомити про помилку або залишити відгук.","У Windows цяпер тыя ж кнопкі, што і ў Linux: «Увайсці ў eUprava», «Наладзіць уваход у браўзеры» і «Праверыць уваход у браўзеры» (карта, драйвер, Firefox і што рабіць далей). У наладах можна паказаць дэманстрацыйныя даныя, а ў «Пра праграму» ёсць кнопка, каб паведаміць пра памылку або пакінуць водгук."],
 [["android"],"Карта читается сама, как только её вставили в уже подключённый считыватель (как на компьютере и iPhone). Выключается в настройках: «Читать карту автоматически при вставке».","The card is read by itself as soon as it is put into an already connected reader (like on the desktop and iPhone). Turn it off in Settings: “Read the card automatically when inserted”.","Kartica se čita sama čim se stavi u već povezani čitač (kao na računaru i iPhone-u). Isključuje se u podešavanjima: „Automatski pročitaj karticu pri umetanju“.","Kartica se čita sama čim se stavi u već spojeni čitač (kao na računalu i iPhoneu). Isključuje se u postavkama: „Automatski pročitaj karticu pri umetanju”.","A kártya magától beolvasódik, amint egy már csatlakoztatott olvasóba helyezik (mint a számítógépen és az iPhone-on). A Beállításokban kikapcsolható: „Kártya automatikus olvasása behelyezéskor”.","Karta lexohet vetë sapo futet në një lexues të lidhur tashmë (si në kompjuter dhe në iPhone). Mund të çaktivizohet te cilësimet: „Lexo kartën automatikisht kur futet”.","Karta sa prečíta sama, hneď ako ju vložíte do už pripojenej čítačky (ako na počítači a iPhone). Vypína sa v nastaveniach: „Prečítať kartu automaticky po vložení“.","Cardul este citit singur de îndată ce este pus într-un cititor deja conectat (ca pe calculator și pe iPhone). Se oprește în Setări: „Citește cardul automat la introducere”.","Картка читається сама, щойно її вставлено в уже підключений зчитувач (як на комп’ютері й iPhone). Вимикається в налаштуваннях: «Автоматично читати картку після вставлення».","Карта чытаецца сама, як толькі яе ўстаўлена ў ужо падключаны счытвальнік (як на кампутары і iPhone). Выключаецца ў наладах: «Аўтаматычна чытаць карту пасля ўстаўлення»."],
 [["android"],"Убрана настройка «Стирать данные автоматически через…»: данные и так показываются только на экране и исчезают, когда вы закрываете приложение или нажимаете «Очистить».","The “Clear data automatically after…” setting is gone: the data is only shown on screen and disappears when you close the app or tap Clear.","Uklonjeno je podešavanje „Automatski obriši podatke posle…“: podaci se prikazuju samo na ekranu i nestaju kada zatvorite aplikaciju ili dodirnete Očisti.","Postavka „Automatski obriši podatke nakon…” je uklonjena: podaci se prikazuju samo na zaslonu i nestaju kad zatvorite aplikaciju ili dodirnete Očisti.","Az „Adatok automatikus törlése ennyi idő után…” beállítás megszűnt: az adatok csak a képernyőn látszanak, és eltűnnek, amikor bezárja az alkalmazást, vagy a Törlésre koppint.","Cilësimi „Fshi të dhënat automatikisht pas…” është hequr: të dhënat shfaqen vetëm në ekran dhe zhduken kur mbyllni aplikacionin ose prekni Pastro.","Nastavenie „Automaticky vymazať údaje po…“ zmizlo: údaje sa zobrazujú len na obrazovke a zmiznú, keď zatvoríte aplikáciu alebo ťuknete na Vymazať.","Setarea „Șterge datele automat după…” a dispărut: datele sunt afișate doar pe ecran și dispar când închideți aplicația sau atingeți Șterge.","Налаштування «Автоматично стирати дані через…» прибрано: дані показуються лише на екрані й зникають, коли ви закриваєте програму або торкаєтеся «Очистити».","Налада «Аўтаматычна сціраць даныя праз…» прыбрана: даныя паказваюцца толькі на экране і знікаюць, калі вы закрываеце праграму або націскаеце «Ачысціць»."],
 [["windows","linux","macos","ios"],"В сообщении об ошибке больше нет технической строки «Подробности: …» (коды карты и системы): она обычному пользователю ни к чему. Остаются понятный заголовок и что делать.","The error message no longer has the technical “Details: …” line (card and system codes): an ordinary user does not need it. The clear title and what to do stay.","U poruci o grešci više nema tehničkog reda „Detalji: …“ (kodovi kartice i sistema): običnom korisniku ne treba. Ostaju jasan naslov i šta da uradi.","U poruci o pogrešci više nema tehničkog retka „Pojedinosti: …” (kodovi kartice i sustava): običnom korisniku ne treba. Ostaju jasan naslov i što učiniti.","A hibaüzenetben már nincs technikai „Részletek: …” sor (kártya- és rendszerkódok): a hétköznapi felhasználónak nincs rá szüksége. Az érthető cím és a teendő megmarad.","Në mesazhin e gabimit nuk ka më rreshtin teknik „Detaje: …” (kodet e kartës dhe të sistemit): një përdoruesi të zakonshëm nuk i duhet. Mbeten titulli i qartë dhe çfarë të bëhet.","V chybovej správe už nie je technický riadok „Podrobnosti: …“ (kódy karty a systému): bežný používateľ ho nepotrebuje. Zostáva zrozumiteľný nadpis a čo robiť.","Mesajul de eroare nu mai are rândul tehnic „Detalii: …” (coduri ale cardului și ale sistemului): un utilizator obișnuit nu are nevoie de el. Rămân titlul clar și ce trebuie făcut.","У повідомленні про помилку більше немає технічного рядка «Подробиці: …» (коди картки й системи): звичайному користувачеві він не потрібен. Лишаються зрозумілий заголовок і що робити.","У паведамленні пра памылку больш няма тэхнічнага радка «Падрабязнасці: …» (коды карты і сістэмы): звычайнаму карыстальніку ён не патрэбны. Застаюцца зразумелы загаловак і што рабіць."],
 [ALL,"В настройках появилась кнопка «Скопировать логи и ошибки»: она копирует технические сведения об ошибках (коды и сообщения, версию и систему, без ваших данных с карты), чтобы вставить их в сообщение об ошибке.","Settings has a new “Copy logs and errors” button: it copies the technical details of the errors (codes and messages, version and system, without your card data) so you can paste them into a bug report.","U podešavanjima je novo dugme „Kopiraj logove i greške“: kopira tehničke podatke o greškama (kodove i poruke, verziju i sistem, bez vaših podataka sa kartice) da ih nalepite u prijavu greške.","U postavkama je novi gumb „Kopiraj zapise i pogreške”: kopira tehničke pojedinosti o pogreškama (kodove i poruke, verziju i sustav, bez podataka s vaše kartice) da ih zalijepite u prijavu pogreške.","A Beállításokban új „Naplók és hibák másolása” gomb van: lemásolja a hibák technikai részleteit (kódokat és üzeneteket, verziót és rendszert, a kártyaadatai nélkül), hogy beilleszthesse őket egy hibajelentésbe.","Te cilësimet ka një buton të ri „Kopjo regjistrat dhe gabimet”: kopjon detajet teknike të gabimeve (kodet dhe mesazhet, versionin dhe sistemin, pa të dhënat e kartës suaj) që t’i ngjitni në një raport gabimi.","V nastaveniach je nové tlačidlo „Kopírovať protokoly a chyby“: skopíruje technické podrobnosti o chybách (kódy a správy, verziu a systém, bez údajov z vašej karty), aby ste ich mohli vložiť do hlásenia chyby.","În Setări există un buton nou „Copiază jurnalele și erorile”: copiază detaliile tehnice ale erorilor (coduri și mesaje, versiunea și sistemul, fără datele de pe cardul dvs.) ca să le puteți lipi într-un raport de eroare.","У налаштуваннях з’явилася нова кнопка «Копіювати журнали та помилки»: вона копіює технічні подробиці помилок (коди й повідомлення, версію та систему, без даних з вашої картки), щоб вставити їх у звіт про помилку.","У наладах з’явілася новая кнопка «Капіяваць журналы і памылкі»: яна капіюе тэхнічныя падрабязнасці памылак (коды і паведамленні, версію і сістэму, без даных з вашай карты), каб уставіць іх у справаздачу пра памылку."],
 [["android"],"Настройки выглядят как остальные экраны: сгруппированы по карточкам (оформление, приватность, чтение карты, помощь). Добавлен переключатель «Показать демо-данные». На экранах «Карта» и «Токен» теперь наши маскоты, считыватель и ключик, как на других системах.","Settings look like the other screens: grouped into cards (appearance, privacy, card reading, help). A “Show demo data” switch is new. The Card and Token screens now have our mascots, the reader and the key, like on the other systems.","Podešavanja izgledaju kao ostali ekrani: grupisana su u kartice (izgled, privatnost, čitanje kartice, pomoć). Dodat je prekidač „Prikaži demo podatke“. Ekrani „Kartica“ i „Token“ sada imaju naše maskote, čitač i ključ, kao na drugim sistemima.","Postavke izgledaju kao ostali zasloni: grupirane su u kartice (izgled, privatnost, čitanje kartice, pomoć). Novi je prekidač „Prikaži demo podatke”. Zasloni „Kartica” i „Token” sada imaju naše maskote, čitač i ključ, kao i drugi sustavi.","A Beállítások úgy néznek ki, mint a többi képernyő: kártyákba csoportosítva (megjelenés, adatvédelem, kártyaolvasás, súgó). Új a „Demóadatok megjelenítése” kapcsoló. A Kártya és a Token képernyőn mostantól ott vannak a kabalafigurák, az olvasó és a kulcs, mint a többi rendszeren.","Cilësimet duken si ekranet e tjera: të grupuara në kartela (pamja, privatësia, leximi i kartës, ndihma). Ka një ndërprerës të ri „Shfaq të dhëna demo”. Ekranet „Karta” dhe „Token” tani kanë maskotat tona, lexuesin dhe çelësin, si në sistemet e tjera.","Nastavenia vyzerajú ako ostatné obrazovky: zoskupené do kariet (vzhľad, súkromie, čítanie karty, pomocník). Nový je prepínač „Zobraziť ukážkové údaje“. Obrazovky Karta a Token majú teraz naše maskoty, čítačku a kľúč, ako ostatné systémy.","Setările arată ca celelalte ecrane: grupate în carduri (aspect, confidențialitate, citirea cardului, ajutor). Un comutator nou „Arată date demo”. Ecranele Card și Token au acum mascotele noastre, cititorul și cheia, ca pe celelalte sisteme.","Налаштування виглядають як інші екрани: згруповані в картки (вигляд, приватність, читання картки, довідка). Новий перемикач «Показати демонстраційні дані». На екранах «Картка» і «Токен» тепер наші маскоти, зчитувач і ключ, як на інших системах.","Налады выглядаюць як іншыя экраны: згрупаваны ў карткі (выгляд, прыватнасць, чытанне карты, даведка). Новы пераключальнік «Паказаць дэманстрацыйныя даныя». На экранах «Карта» і «Токен» цяпер нашы маскоты, счытвальнік і ключ, як на іншых сістэмах."],
 [["macos","ios","android"],"В «О программе» (в настройках на iPhone и Android) появились кнопки «Что нового?» и «Сообщить об ошибке или оставить отзыв»: теперь они есть на всех системах.","About (Settings on iPhone and Android) now has the “What’s new?” and “Report a bug or leave feedback” buttons, so every system has them.","U odeljku „O programu“ (u podešavanjima na iPhone-u i Androidu) sada su dugmad „Šta je novo?“ i „Prijavi grešku ili ostavi povratnu informaciju“, pa ih imaju svi sistemi.","U odjeljku „O programu” (u postavkama na iPhoneu i Androidu) sada su gumbi „Što je novo?” i „Prijavi pogrešku ili ostavi povratnu informaciju”, pa ih imaju svi sustavi.","A Névjegyben (iPhone-on és Androidon a Beállításokban) mostantól ott van a „Mi újság?” és a „Hibajelentés vagy visszajelzés küldése” gomb, így minden rendszeren megvan.","Te „Rreth programit” (te cilësimet në iPhone dhe Android) tani ka butonat „Çfarë ka të re?” dhe „Raporto një gabim ose lër një koment”, ndaj i kanë të gjitha sistemet.","V „O aplikácii“ (na iPhone a Androide v nastaveniach) sú teraz tlačidlá „Čo je nové?“ a „Nahlásiť chybu alebo zanechať spätnú väzbu“, takže ich majú všetky systémy.","În „Despre” (în Setări pe iPhone și Android) sunt acum butoanele „Ce este nou?” și „Raportează o eroare sau lasă un comentariu”, așa că le au toate sistemele.","У «Про програму» (в налаштуваннях на iPhone та Android) тепер є кнопки «Що нового?» і «Повідомити про помилку або залишити відгук», тож вони є на всіх системах.","У «Пра праграму» (у наладах на iPhone і Android) цяпер ёсць кнопкі «Што новага?» і «Паведаміць пра памылку або пакінуць водгук», таму яны ёсць на ўсіх сістэмах."],
]],

 [["macos"],"Работает на macOS 12 (Monterey), в том числе на Mac с процессором Intel.","Works on macOS 12 (Monterey), Intel Macs included.","Radi na macOS-u 12 (Monterey), uključujući Mac sa Intel procesorom.","Radi na macOS-u 12 (Monterey), uključujući Macove s Intelovim procesorom.","Működik macOS 12 (Monterey) alatt, az Intel processzoros Maceken is.","Punon në macOS 12 (Monterey), përfshirë Mac-et me procesor Intel.","Funguje na macOS 12 (Monterey), vrátane Macov s procesorom Intel.","Funcționează pe macOS 12 (Monterey), inclusiv pe Mac-uri cu procesor Intel.","Працює на macOS 12 (Monterey), зокрема на Mac з процесором Intel.","Працуе на macOS 12 (Monterey), у тым ліку на Mac з працэсарам Intel."],
 [ALL,"Единая нумерация: версия релиза на GitHub совпадает с версией в App Store, каждое обновление получает новый номер. Версия 1.4.5 продолжает нумерацию iOS (1.4.0).","One version number: the release on GitHub has the same version as the App Store, and every update gets a new number. Version 1.4.5 continues the numbering of iOS (1.4.0).","Jedinstvena numeracija: izdanje na GitHub-u ima istu verziju kao App Store, a svako ažuriranje dobija novi broj. Verzija 1.4.5 nastavlja numeraciju iOS-a (1.4.0).","Jedan broj verzije: izdanje na GitHubu ima istu verziju kao App Store, a svako ažuriranje dobiva novi broj. Verzija 1.4.5 nastavlja numeraciju iOS-a (1.4.0).","Egyetlen verziószám: a GitHubon a kiadás verziója megegyezik az App Storeéval, és minden frissítés új számot kap. Az 1.4.5-ös verzió az iOS számozását folytatja (1.4.0).","Një numër i vetëm versioni: botimi në GitHub ka të njëjtin version si App Store dhe çdo përditësim merr numër të ri. Versioni 1.4.5 vazhdon numërimin e iOS (1.4.0).","Jedno číslo verzie: vydanie na GitHube má rovnakú verziu ako App Store a každá aktualizácia dostane nové číslo. Verzia 1.4.5 nadväzuje na číslovanie iOS (1.4.0).","Un singur număr de versiune: versiunea de pe GitHub are aceeași versiune ca App Store, iar fiecare actualizare primește un număr nou. Versiunea 1.4.5 continuă numerotarea iOS (1.4.0).","Один номер версії: випуск на GitHub має ту саму версію, що й App Store, а кожне оновлення отримує новий номер. Версія 1.4.5 продовжує нумерацію iOS (1.4.0).","Адзін нумар версіі: выпуск на GitHub мае тую ж версію, што і App Store, а кожнае абнаўленне атрымлівае новы нумар. Версія 1.4.5 працягвае нумарацыю iOS (1.4.0)."]
]],
["0.9.15","2026-11-21",[
 [["macos","linux"],"Подсказка под кнопкой «Войти на eUprava»: если браузер не предлагает карту, полностью закройте его и откройте страницу заново, затем выньте карту из ридера и вставьте снова. Кнопка «Проверить вход в браузере» показывает, что именно не так (нет карты в ридере, в macOS не зарегистрирован драйвер карты, в Linux модуль не подключён к браузеру, система не видит карту), и что сделать дальше.","A tip under the “Sign in to eUprava” button: if the browser does not offer the card, quit it completely and open the page again, then take the card out of the reader and put it back in. The “Check browser sign-in” button shows what exactly is wrong (no card in the reader, the card driver is not registered with macOS, the module is not connected to the browser on Linux, the system does not see the card) and what to do next.","Savet ispod dugmeta „Prijava na eUpravu“: ako pregledač ne nudi karticu, potpuno ga zatvorite i ponovo otvorite stranicu, pa izvadite karticu iz čitača i ponovo je umetnite. Dugme „Proveri prijavu u pregledaču“ pokazuje šta tačno nije u redu (nema kartice u čitaču, u macOS-u drajver kartice nije registrovan, u Linux-u modul nije povezan sa pregledačem, sistem ne vidi karticu) i šta dalje.","Savjet ispod gumba „Prijava na eUpravu”: ako preglednik ne nudi karticu, potpuno ga zatvorite i ponovno otvorite stranicu, zatim izvadite karticu iz čitača i ponovno je umetnite. Gumb „Provjeri prijavu u pregledniku” pokazuje što je točno pogrešno (nema kartice u čitaču, upravljački program kartice nije registriran u macOS-u, modul nije povezan s preglednikom na Linuxu, sustav ne vidi karticu) i što dalje.","Tipp az „Bejelentkezés az eUprávába” gomb alatt: ha a böngésző nem kínálja fel a kártyát, zárja be teljesen, és nyissa meg újra az oldalt, majd vegye ki a kártyát az olvasóból, és helyezze vissza. A „Bejelentkezés ellenőrzése a böngészőben” gomb megmutatja, mi a hiba (nincs kártya az olvasóban, a kártya-illesztőprogram nincs regisztrálva a macOS-ben, Linuxon a modul nincs összekötve a böngészővel, a rendszer nem látja a kártyát), és hogy mi a teendő.","Një këshillë nën butonin „Hyr në eUprava”: nëse shfletuesi nuk e ofron kartën, mbylleni plotësisht dhe hapni faqen përsëri, pastaj nxirreni kartën nga lexuesi dhe futeni sërish. Butoni „Kontrollo hyrjen në shfletues” tregon çfarë saktësisht nuk shkon (nuk ka kartë në lexues, drejtuesi i kartës nuk është regjistruar në macOS, moduli nuk është lidhur me shfletuesin në Linux, sistemi nuk e sheh kartën) dhe çfarë të bëhet më tej.","Tip pod tlačidlom „Prihlásiť sa do eUprava“: ak prehliadač kartu neponúka, úplne ho zatvorte a stránku otvorte znova, potom kartu vyberte z čítačky a vložte späť. Tlačidlo „Skontrolovať prihlásenie v prehliadači“ ukáže, čo presne nie je v poriadku (v čítačke nie je karta, ovládač karty nie je zaregistrovaný v macOS, modul nie je v Linuxe prepojený s prehliadačom, systém kartu nevidí) a čo robiť ďalej.","Un sfat sub butonul „Autentificare la eUprava”: dacă browserul nu oferă cardul, închideți-l complet și deschideți pagina din nou, apoi scoateți cardul din cititor și puneți-l la loc. Butonul „Verifică autentificarea în browser” arată ce anume nu este în regulă (nu este card în cititor, driverul cardului nu este înregistrat în macOS, modulul nu este conectat la browser pe Linux, sistemul nu vede cardul) și ce urmează.","Підказка під кнопкою «Увійти на eUprava»: якщо браузер не пропонує картку, повністю закрийте його й відкрийте сторінку знову, потім витягніть картку зі зчитувача й вставте назад. Кнопка «Перевірити вхід у браузері» показує, що саме не так (у зчитувачі немає картки, драйвер картки не зареєстровано в macOS, модуль не з’єднано з браузером у Linux, система не бачить картки) і що робити далі.","Падказка пад кнопкай «Увайсці ў eUprava»: калі браўзер не прапануе карту, цалкам зачыніце яго і адкрыйце старонку зноў, потым выміце карту са счытвальніка і ўстаўце назад. Кнопка «Праверыць уваход у браўзеры» паказвае, што менавіта не так (у счытвальніку няма карты, драйвер карты не зарэгістраваны ў macOS, модуль не злучаны з браўзерам у Linux, сістэма не бачыць карту) і што рабіць далей."],
 [["windows"],"В настройках, в блоке «Вход в браузере», появилась подсказка на случай, если браузер не предлагает карту.","Settings, in the “Browser login” block, now has a tip for when the browser does not offer the card.","U podešavanjima, u bloku „Prijava u pregledaču“, sada postoji savet za slučaj da pregledač ne nudi karticu.","U postavkama, u bloku „Prijava u pregledniku”, sada je savjet za slučaj kad preglednik ne nudi karticu.","A Beállításokban, a „Bejelentkezés a böngészőben” blokkban mostantól tipp van arra az esetre, ha a böngésző nem kínálja fel a kártyát.","Te cilësimet, në bllokun „Hyrja në shfletues”, tani ka një këshillë për rastin kur shfletuesi nuk e ofron kartën.","V nastaveniach, v bloku „Prihlásenie v prehliadači“, je teraz tip pre prípad, keď prehliadač kartu neponúka.","În Setări, în blocul „Autentificare în browser”, există acum un sfat pentru cazul în care browserul nu oferă cardul.","У налаштуваннях, у блоці «Вхід у браузері», тепер є підказка на випадок, коли браузер не пропонує картку.","У наладах, у блоку «Уваход у браўзеры», цяпер ёсць падказка на выпадак, калі браўзер не прапануе карту."],
 [["android"],"Приложение больше не падает при запуске на устройстве без службы USB (часть эмуляторов и облачных телефонов): вместо этого оно сообщает, что ридер здесь подключить нельзя. Новая иконка: тот же щит, что на остальных системах.","The app no longer crashes at start on a device without a USB service (some emulators and cloud phones): it says that a reader cannot be connected there instead. New icon: the same shield as on the other systems.","Aplikacija se više ne ruši pri pokretanju na uređaju bez USB usluge (neki emulatori i oblak telefoni): umesto toga kaže da se čitač ovde ne može povezati. Nova ikona: isti štit kao na ostalim sistemima.","Aplikacija se više ne ruši pri pokretanju na uređaju bez USB usluge (neki emulatori i oblačni telefoni): umjesto toga javlja da se ondje čitač ne može spojiti. Nova ikona: isti štit kao na drugim sustavima.","Az alkalmazás már nem omlik össze indításkor USB-szolgáltatás nélküli eszközön (egyes emulátorokon és felhőtelefonokon): helyette jelzi, hogy ott nem csatlakoztatható olvasó. Új ikon: ugyanaz a pajzs, mint a többi rendszeren.","Aplikacioni nuk prishet më në nisje në një pajisje pa shërbim USB (disa emulatorë dhe telefona në re): në vend të kësaj thotë se aty nuk mund të lidhet lexues. Ikonë e re: i njëjti mburojë si në sistemet e tjera.","Aplikácia už nepadá pri spustení na zariadení bez služby USB (niektoré emulátory a cloudové telefóny): namiesto toho oznámi, že tam sa čítačka pripojiť nedá. Nová ikona: rovnaký štít ako na iných systémoch.","Aplicația nu se mai blochează la pornire pe un dispozitiv fără serviciu USB (unele emulatoare și telefoane în cloud): în schimb spune că acolo nu se poate conecta un cititor. Pictogramă nouă: același scut ca pe celelalte sisteme.","Програма більше не падає під час запуску на пристрої без служби USB (деякі емулятори й хмарні телефони): натомість вона повідомляє, що там зчитувач підключити не можна. Нова іконка: той самий щит, що й на інших системах.","Праграма больш не падае пры запуску на прыладзе без службы USB (некаторыя эмулятары і воблачныя тэлефоны): замест гэтага яна паведамляе, што там счытвальнік падключыць нельга. Новая іконка: той самы шчыт, што і на іншых сістэмах."]
]],
["0.9.14","2026-11-20",[
 [["linux"],"Вход в браузере: Firefox (в том числе профили Firefox 147+), Chrome, Edge, Chromium и Brave. Новые профили и браузеры подключаются сами после первого согласия. Понятные сообщения, если служба смарт-карт не запущена или система слишком старая для модуля. Модуль для входа в браузере теперь собирается из исходников автора под glibc 2.28+ (Ubuntu 20.04 и новее, Debian 10 и новее) и входит и в сборки для arm64.","Browser sign-in: Firefox (including the profiles of Firefox 147+), Chrome, Edge, Chromium and Brave. New profiles and browsers are connected by themselves after you agree once. Clear messages when the smart card service is not running or the system is too old for the module. The browser sign-in module is now built from the author’s source for glibc 2.28+ (Ubuntu 20.04 and newer, Debian 10 and newer) and is included in the arm64 builds too.","Prijava u pregledaču: Firefox (uključujući profile Firefox-a 147+), Chrome, Edge, Chromium i Brave. Novi profili i pregledači povezuju se sami posle prve saglasnosti. Jasne poruke kad usluga za pametne kartice nije pokrenuta ili je sistem prestar za modul. Modul za prijavu u pregledaču sada se gradi iz autorovog izvornog koda za glibc 2.28+ (Ubuntu 20.04 i noviji, Debian 10 i noviji) i uključen je i u arm64 gradnje.","Prijava u pregledniku: Firefox (uključujući profile Firefoxa 147+), Chrome, Edge, Chromium i Brave. Novi profili i preglednici povezuju se sami nakon što jednom pristanete. Jasne poruke kad usluga pametnih kartica ne radi ili je sustav prestar za modul. Modul za prijavu u pregledniku sada se gradi iz autorova izvornog koda za glibc 2.28+ (Ubuntu 20.04 i noviji, Debian 10 i noviji) i uključen je i u arm64 izdanja.","Böngészős bejelentkezés: Firefox (a Firefox 147+ profiljaival együtt), Chrome, Edge, Chromium és Brave. Az új profilok és böngészők egyetlen jóváhagyás után magukat kötik össze. Érthető üzenetek, ha az intelligenskártya-szolgáltatás nem fut, vagy a rendszer túl régi a modulhoz. A böngészős bejelentkezés modulja mostantól a szerző forráskódjából épül glibc 2.28+ rendszerekre (Ubuntu 20.04 és újabb, Debian 10 és újabb), és az arm64-es változatokban is benne van.","Hyrja në shfletues: Firefox (përfshirë profilet e Firefox 147+), Chrome, Edge, Chromium dhe Brave. Profilet dhe shfletuesit e rinj lidhen vetë pasi të pranoni një herë. Mesazhe të qarta kur shërbimi i kartave inteligjente nuk punon ose sistemi është shumë i vjetër për modulin. Moduli i hyrjes në shfletues tani ndërtohet nga kodi burimor i autorit për glibc 2.28+ (Ubuntu 20.04 e më të reja, Debian 10 e më të reja) dhe përfshihet edhe në versionet arm64.","Prihlásenie v prehliadači: Firefox (vrátane profilov Firefoxu 147+), Chrome, Edge, Chromium a Brave. Nové profily a prehliadače sa pripoja samy po jednom súhlase. Jasné správy, keď služba čipových kariet nebeží alebo je systém na modul príliš starý. Modul na prihlásenie v prehliadači sa teraz zostavuje zo zdrojového kódu autora pre glibc 2.28+ (Ubuntu 20.04 a novšie, Debian 10 a novšie) a je súčasťou aj zostáv pre arm64.","Autentificare în browser: Firefox (inclusiv profilurile Firefox 147+), Chrome, Edge, Chromium și Brave. Profilurile și browserele noi se conectează singure după ce vă dați acordul o dată. Mesaje clare când serviciul de carduri inteligente nu rulează sau sistemul este prea vechi pentru modul. Modulul pentru autentificarea în browser este acum construit din codul sursă al autorului pentru glibc 2.28+ (Ubuntu 20.04 și mai noi, Debian 10 și mai noi) și este inclus și în versiunile arm64.","Вхід у браузері: Firefox (зокрема профілі Firefox 147+), Chrome, Edge, Chromium і Brave. Нові профілі та браузери підключаються самі після однієї вашої згоди. Зрозумілі повідомлення, коли служба смарт-карток не працює або система занадто стара для модуля. Модуль входу в браузері тепер збирається з вихідного коду автора для glibc 2.28+ (Ubuntu 20.04 і новіші, Debian 10 і новіші) і входить також до збірок для arm64.","Уваход у браўзеры: Firefox (у тым ліку профілі Firefox 147+), Chrome, Edge, Chromium і Brave. Новыя профілі і браўзеры падключаюцца самі пасля адной вашай згоды. Зразумелыя паведамленні, калі служба смарт-карт не працуе або сістэма занадта старая для модуля. Модуль уваходу ў браўзеры цяпер збіраецца з зыходнага кода аўтара для glibc 2.28+ (Ubuntu 20.04 і навейшыя, Debian 10 і навейшыя) і ўваходзіць таксама ў зборкі для arm64."],
 [["windows","macos"],"Firefox и Edge берут сертификат карты из системы, как Chrome. Приложение проверяет настройку Firefox и, если она выключена, включает её после вашего согласия.","Firefox and Edge take the card certificate from the system, like Chrome. The app checks the Firefox setting for this and, if it is off, turns it on after you agree.","Firefox i Edge uzimaju sertifikat kartice iz sistema, kao Chrome. Aplikacija proverava podešavanje Firefox-a i, ako je isključeno, uključuje ga uz vašu saglasnost.","Firefox i Edge preuzimaju certifikat kartice iz sustava, kao Chrome. Aplikacija provjerava postavku Firefoxa za to i, ako je isključena, uključuje je nakon vašeg pristanka.","A Firefox és az Edge a kártya tanúsítványát a rendszerből veszi, mint a Chrome. Az alkalmazás ellenőrzi ehhez a Firefox beállítását, és ha ki van kapcsolva, az Ön jóváhagyása után bekapcsolja.","Firefox dhe Edge e marrin certifikatën e kartës nga sistemi, si Chrome. Aplikacioni kontrollon cilësimin e Firefox për këtë dhe, nëse është i çaktivizuar, e aktivizon pasi të pranoni.","Firefox a Edge preberajú certifikát karty zo systému, ako Chrome. Aplikácia na to skontroluje nastavenie Firefoxu a ak je vypnuté, po vašom súhlase ho zapne.","Firefox și Edge iau certificatul cardului din sistem, ca Chrome. Aplicația verifică setarea Firefox pentru asta și, dacă este oprită, o pornește după acordul dvs.","Firefox і Edge беруть сертифікат картки із системи, як Chrome. Програма перевіряє для цього налаштування Firefox і, якщо воно вимкнене, вмикає його після вашої згоди.","Firefox і Edge бяруць сертыфікат карты з сістэмы, як Chrome. Праграма правярае для гэтага наладу Firefox і, калі яна выключана, уключае яе пасля вашай згоды."],
 [["windows","linux","android"],"Кнопка «Нет считывателя?» открывает страницу о том, какой считыватель купить (в macOS и iOS она уже была).","The “No reader yet?” button opens the page about which reader to get (macOS and iOS already had it).","Dugme „Nemate čitač?“ otvara stranicu o tome koji čitač kupiti (macOS i iOS su je već imali).","Gumb „Nemate čitač?” otvara stranicu o tome koji čitač nabaviti (macOS i iOS već su je imali).","A „Még nincs olvasója?” gomb megnyitja az oldalt arról, melyik olvasót érdemes beszerezni (macOS-en és iOS-en már megvolt).","Butoni „Nuk keni lexues?” hap faqen për atë se cilin lexues të merrni (macOS dhe iOS e kishin tashmë).","Tlačidlo „Nemáte čítačku?“ otvorí stránku o tom, akú čítačku zohnať (macOS a iOS ju už mali).","Butonul „Nu aveți cititor?” deschide pagina despre ce cititor să luați (macOS și iOS o aveau deja).","Кнопка «Немає зчитувача?» відкриває сторінку про те, який зчитувач придбати (на macOS та iOS вона вже була).","Кнопка «Няма счытвальніка?» адкрывае старонку пра тое, які счытвальнік набыць (на macOS і iOS яна ўжо была)."],

 [["windows"],"Версия для Windows XP, Vista и 7 (и 32-битных систем) на .NET Framework 4.0. Драйвер карты для входа в браузере требует Windows Vista или новее, автообновление требует TLS 1.2.","A build for Windows XP, Vista and 7 (and 32-bit systems) on .NET Framework 4.0. The card driver for browser sign-in needs Windows Vista or newer, automatic updates need TLS 1.2.","Verzija za Windows XP, Vista i 7 (i 32-bitne sisteme) na .NET Framework 4.0. Drajver kartice za prijavu u pregledaču zahteva Windows Vista ili noviji, automatsko ažuriranje zahteva TLS 1.2.","Izdanje za Windows XP, Vistu i 7 (i 32-bitne sustave) na .NET Frameworku 4.0. Upravljački program kartice za prijavu u pregledniku traži Windows Vistu ili noviji, a automatska ažuriranja traže TLS 1.2.","Build Windows XP-hez, Vistához és 7-hez (és 32 bites rendszerekhez) .NET Framework 4.0-n. A böngészős bejelentkezéshez a kártya-illesztőprogramnak Windows Vista vagy újabb kell, az automatikus frissítéshez TLS 1.2.","Një version për Windows XP, Vista dhe 7 (dhe sistemet 32-bit) në .NET Framework 4.0. Drejtuesi i kartës për hyrjen në shfletues kërkon Windows Vista ose më të ri, përditësimet automatike kërkojnë TLS 1.2.","Zostava pre Windows XP, Vista a 7 (a 32-bitové systémy) na .NET Framework 4.0. Ovládač karty na prihlásenie v prehliadači potrebuje Windows Vista alebo novší, automatické aktualizácie potrebujú TLS 1.2.","O versiune pentru Windows XP, Vista și 7 (și sisteme pe 32 de biți) pe .NET Framework 4.0. Driverul cardului pentru autentificarea în browser cere Windows Vista sau mai nou, actualizările automate cer TLS 1.2.","Збірка для Windows XP, Vista і 7 (та 32-бітних систем) на .NET Framework 4.0. Драйвер картки для входу в браузері потребує Windows Vista або новішої, автоматичні оновлення потребують TLS 1.2.","Зборка для Windows XP, Vista і 7 (і 32-бітных сістэм) на .NET Framework 4.0. Драйвер карты для ўваходу ў браўзеры патрабуе Windows Vista або навейшай, аўтаматычныя абнаўленні патрабуюць TLS 1.2." function detectLang(){
 const list=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""]).map(x=>String(x).toLowerCase());
 for(const l of list){
  if(l.startsWith("sr")) return /cyrl/.test(l)?"sc":"sr";
  if(/^(bs|me)\b/.test(l)) return "sr";
  {const m=/^(hu|sq|sk|ro|hr|uk|be)\b/.exec(l);if(m)return m[1]}
  if(/^(ru|kk)\b/.test(l)) return "ru";
  if(l.startsWith("en")) return "en";
 }
 return "en";
}

function cyr(s){let o="",i=0;
 while(i<s.length){const c=s[i],d=(c+(s[i+1]||"")).toLowerCase(),up=c!==c.toLowerCase();
  const di={lj:"љ",nj:"њ",dž:"џ"}[d];
  if(di){o+=up?di.toUpperCase():di;i+=2;continue}
  const m=CYR[c.toLowerCase()];
  if(m){o+=up?m.toUpperCase():m}else o+=c;
  i++}
 return o}

 for(const m of t.matchAll(KEEP)){o+=cyr(t.slice(last,m.index))+m[1]+m[2];last=m.index+m[0].length}
