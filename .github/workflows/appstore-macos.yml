name: App Store (macOS)

# Manual: builds the sandboxed Mac App Store package, signs it and uploads it to App Store Connect.
# Repository secrets:
#   APPLE_TEAM_ID                 10-character team id
#   MAC_APP_CERT_P12_BASE64       "3rd Party Mac Developer Application" (or Apple Distribution) certificate + key, .p12, base64
#   MAC_INSTALLER_CERT_P12_BASE64 "3rd Party Mac Developer Installer" certificate + key, .p12, base64
#   MAC_CERT_PASSWORD             password of both .p12 files
#   MAC_APP_PROFILE_BASE64        Mac App Store provisioning profile for com.peregond.supercelik, base64
#   MAC_EXT_PROFILE_BASE64        Mac App Store provisioning profile for com.peregond.supercelik.token, base64
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64   App Store Connect API key (as for the iOS workflow)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      build:
        description: "Build number (must grow with every upload); empty = run number"
        required: false

jobs:
  upload:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          S1: ${{ secrets.APPLE_TEAM_ID }}
          S2: ${{ secrets.MAC_APP_CERT_P12_BASE64 }}
          S3: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          S4: ${{ secrets.MAC_CERT_PASSWORD }}
          S5: ${{ secrets.MAC_APP_PROFILE_BASE64 }}
          S6: ${{ secrets.MAC_EXT_PROFILE_BASE64 }}
          S7: ${{ secrets.ASC_KEY_ID }}
          S8: ${{ secrets.ASC_ISSUER_ID }}
          S9: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for v in S1 S2 S3 S4 S5 S6 S7 S8 S9; do [ -n "${!v}" ] || { echo "::error::Missing a repository secret (see the comment at the top of this workflow)"; exit 1; }; done
      - name: Import certificates and profiles
        env:
          APP_P12: ${{ secrets.MAC_APP_CERT_P12_BASE64 }}
          INS_P12: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          PASS: ${{ secrets.MAC_CERT_PASSWORD }}
          APP_PROF: ${{ secrets.MAC_APP_PROFILE_BASE64 }}
          EXT_PROF: ${{ secrets.MAC_EXT_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KP="$(openssl rand -hex 16)"
          security create-keychain -p "$KP" "$KC"; security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$APP_P12" | base64 -d > "$RUNNER_TEMP/app.p12"; echo "$INS_P12" | base64 -d > "$RUNNER_TEMP/ins.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$PASS" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/ins.p12" -k "$KC" -P "$PASS" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          echo "$APP_PROF" | base64 -d > "$RUNNER_TEMP/app.provisionprofile"
          echo "$EXT_PROF" | base64 -d > "$RUNNER_TEMP/ext.provisionprofile"
          echo "APP_IDENTITY=$(security find-identity -v "$KC" | grep -E 'Mac Developer Application|Apple Distribution' | head -1 | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$(security find-identity -v "$KC" | grep -E 'Mac Developer Installer|Mac Installer Distribution' | head -1 | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_ENV"
      - name: Build, sign and package
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUILD="${{ github.event.inputs.build }}"; BUILD="${BUILD:-${{ github.run_number }}}"
          APP_PROFILE="$RUNNER_TEMP/app.provisionprofile" EXT_PROFILE="$RUNNER_TEMP/ext.provisionprofile" \
            bash scripts/make-appstore-mac.sh "${{ github.event.inputs.version }}" "$BUILD"
      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys && echo "$P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f dist/SuperCelik-*-appstore.pkg -t macos --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
