name: Screenshots

on:
  pull_request:
    paths: [".github/workflows/screenshots.yml"]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate + build for the simulator
        run: |
          cd ios && xcodegen generate && cd ..
          xcodebuild -project ios/SuperCelik.xcodeproj -scheme SuperCelik -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Screenshots
        run: |
          mkdir -p shots
          shot() { # name, device-substring, appearance
            UDID=$(xcrun simctl list devices available | grep "$2" | head -1 | grep -oE '[0-9A-F-]{36}')
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl ui "$UDID" appearance "$3"
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/SuperCelik.app
            xcrun simctl launch "$UDID" com.peregond.supercelik.ios --demo
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$1.png"
            xcrun simctl shutdown "$UDID"
          }
          shot iphone-light "iPhone 16 (" light
          shot iphone-dark "iPhone 16 (" dark
          shot ipad-light "iPad Pro 13-inch" light
      - uses: actions/upload-artifact@v4
        with: { name: shots-ios, path: shots/*.png }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle -p android assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          script: bash .github/scripts/android-shots.sh
      - uses: actions/upload-artifact@v4
        with: { name: shots-android, path: shots/*.png }
