name: Screenshots
# (trigger: touching this file in a PR runs the job) [android print layout check]

on:
  pull_request:
    paths: [".github/workflows/screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    needs: [ios, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Push PNGs to a throwaway branch
        run: |
          mkdir -p /tmp/shots && cp out/*/*.png /tmp/shots/
          git config user.name "ci" && git config user.email "ci@example.invalid"
          git checkout --orphan screenshots-out
          git rm -rf . -q
          cp /tmp/shots/*.png .
          git add *.png && git commit -qm "screenshots"
          git push -f origin screenshots-out

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/SuperCelik.xcodeproj -scheme SuperCelik -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Screenshots
        run: |
          mkdir -p shots
          shot() { # name, device-substring, appearance, launch args
            UDID=$(xcrun simctl list devices available | grep "$2" | head -1 | grep -oE '[0-9A-F-]{36}')
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl ui "$UDID" appearance "$3"
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/SuperCelik.app
            xcrun simctl launch "$UDID" com.peregond.supercelik.ios --demo $4
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$1.png"
            xcrun simctl shutdown "$UDID"
          }
          shot iphone-light "iPhone" light
          shot iphone-dark "iPhone" dark
          shot iphone-pdf "iPhone" light --pdf
          shot ipad-light "iPad" light
          shot ipad-pdf "iPad" light --pdf
      - uses: actions/upload-artifact@v4
        with: { name: shots-ios, path: shots/*.png }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle -p android assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-shots.sh
      - uses: actions/upload-artifact@v4
        with: { name: shots-android, path: shots/*.png }
