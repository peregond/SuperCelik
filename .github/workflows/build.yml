name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach installers to a release

jobs:
  macos:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]   # Apple Silicon, Intel
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Build .app and .dmg
        run: bash scripts/make-app.sh "${{ steps.ver.outputs.v }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-macOS-${{ matrix.arch }}
          path: dist/*.dmg
      - name: UI screenshots (demo data, arm64 only)
        if: matrix.arch == 'arm64'
        continue-on-error: true
        run: |
          mkdir -p shots
          for spec in "personal" "token" "settings" "personal --dark" "personal --problem"; do
            name=$(echo "$spec" | tr ' ' '_' | tr -d '-')
            out="$PWD/shots/$name.png"
            open -n dist/SuperCelik.app --args --shot "$out" $spec
            for i in $(seq 1 40); do [ -f "$out" ] && break; sleep 1; done
            pkill -x SerbiaID || true
            sleep 1
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: SuperCelik-macOS-screenshots
          path: shots
          if-no-files-found: ignore
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Publish (self-contained, x64)
        run: dotnet publish windows/SerbiaID.Windows -c Release -r win-x64 --self-contained -p:Version=${{ steps.ver.outputs.v }} -o dist/win-x64
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-windows-x64
          path: dist/*-setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe
          generate_release_notes: true

