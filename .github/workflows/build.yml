name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach installers to a release

jobs:
  macos:
    # macOS 26 image: building against the current SDK is what gives the app the current system
    # look (glass toolbar and sidebar) on macOS 26 and later. The app still runs on macOS 13+.
    runs-on: xcode-27
    strategy:
      matrix:
        arch: [arm64, x86_64]   # Apple Silicon, Intel
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Build .app and .dmg
        run: bash scripts/make-app.sh "${{ steps.ver.outputs.v }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-macOS-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.dmg

  macos-appstore:
    # Compile and layout check of the Mac App Store variant (sandbox entitlements, no updater); the ad-hoc signed
    # app is not uploadable. The real signed package comes from the "App Store (macOS)" workflow.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build the App Store variant (ad-hoc signed)
        run: UNSIGNED=1 bash scripts/make-appstore-mac.sh 0.0.0 1
      - name: Check the bundle
        run: |
          APP=dist/SuperCelik.app
          codesign -d --entitlements - "$APP" 2>&1 | grep -E "app-sandbox|smartcard"
          test -f "$APP/Contents/PlugIns/SuperCelikToken.appex/Contents/Info.plist"
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :LSApplicationCategoryType" "$APP/Contents/Info.plist"

  ios:
    # Unsigned builds: an .ipa for re-signing and a simulator app that runs on a Mac as is.
    # Installing on an iPhone with working NFC needs the user's own paid Apple Developer team
    # (NFC tag reading is not available to free teams), see ios/README.md.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project ios/SuperCelik.xcodeproj -scheme SuperCelik -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            MARKETING_VERSION="${{ steps.ver.outputs.v }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project ios/SuperCelik.xcodeproj -scheme SuperCelik -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            MARKETING_VERSION="${{ steps.ver.outputs.v }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p dist ios-pkg/Payload
          cp -R build/device/Build/Products/Release-iphoneos/SuperCelik.app ios-pkg/Payload/
          (cd ios-pkg && zip -qry "../dist/SuperCelik-$V-iOS-unsigned.ipa" Payload)
          ditto -c -k --keepParent build/sim/Build/Products/Release-iphonesimulator/SuperCelik.app \
            "dist/SuperCelik-$V-iOS-simulator.zip"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-iOS
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Publish (self-contained, x64)
        run: dotnet publish windows/SerbiaID.Windows -c Release -r win-x64 --self-contained -p:Version=${{ steps.ver.outputs.v }} -o dist/win-x64
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install the Cryptographic Provider Development Kit (cardmod.h)
        # community.chocolatey.org sometimes answers 504 and choco then "installs 0/0 packages" with exit code 0: retry and check the header is there
        run: |
          for ($i = 1; $i -le 4; $i++) {
            choco install windows-cryptographic-provider-development-kit -y --no-progress
            if (Test-Path "C:\Program Files (x86)\Windows Kits\10\Cryptographic Provider Development Kit\Include\cardmod.h") { exit 0 }
            Write-Host "cardmod.h not found after attempt $i"; Start-Sleep -Seconds (15 * $i)
          }
          exit 1
      - name: Build the smart card minidriver (x64)
        shell: cmd
        run: |
          cl /nologo /O2 /W3 /MT /LD /I"C:\Program Files (x86)\Windows Kits\10\Cryptographic Provider Development Kit\Include" /Fe:dist\win-x64\SuperCelikMD.dll windows\minidriver\scelik_md.c /link /DEF:windows\minidriver\scelik_md.def advapi32.lib winscard.lib bcrypt.lib
          dir dist\win-x64\SuperCelikMD.dll
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-windows-x64
          path: dist/*-setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*-setup.exe

  windows-legacy:
    # Windows XP / Vista / 7 and 32-bit Windows: .NET Framework 4.0 build (the last .NET that runs on XP), x86, with
    # the card minidriver in two flavours (x86 and x64: a 64-bit Windows 7 runs this 32-bit app but its browsers are 64-bit).
    # The installer is made with Inno Setup 5.6.1: version 6 does not run on XP.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Build (.NET Framework 4.0, x86)
        run: dotnet build windows/SerbiaID.Windows.Legacy -c Release -p:Version=${{ steps.ver.outputs.v }} -o dist/win-x86-legacy
      - name: Install the Cryptographic Provider Development Kit (cardmod.h)
        run: |
          for ($i = 1; $i -le 4; $i++) {
            choco install windows-cryptographic-provider-development-kit -y --no-progress
            if (Test-Path "C:\Program Files (x86)\Windows Kits\10\Cryptographic Provider Development Kit\Include\cardmod.h") { exit 0 }
            Write-Host "cardmod.h not found after attempt $i"; Start-Sleep -Seconds (15 * $i)
          }
          exit 1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x86
      - name: Build the smart card minidriver (x86)
        shell: cmd
        run: |
          cl /nologo /O2 /W3 /MT /LD /I"C:\Program Files (x86)\Windows Kits\10\Cryptographic Provider Development Kit\Include" /Fe:dist\win-x86-legacy\SuperCelikMD.dll windows\minidriver\scelik_md.c /link /DEF:windows\minidriver\scelik_md.def advapi32.lib winscard.lib bcrypt.lib
          dir dist\win-x86-legacy\SuperCelikMD.dll
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Build the smart card minidriver (x64, for 64-bit browsers on 64-bit Windows 7)
        shell: cmd
        run: |
          cl /nologo /O2 /W3 /MT /LD /I"C:\Program Files (x86)\Windows Kits\10\Cryptographic Provider Development Kit\Include" /Fe:dist\win-x86-legacy\SuperCelikMD64.dll windows\minidriver\scelik_md.c /link /DEF:windows\minidriver\scelik_md.def advapi32.lib winscard.lib bcrypt.lib
          dir dist\win-x86-legacy\SuperCelikMD64.dll
      - name: Download the .NET Framework 4.0 redistributable (goes into the installer)
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          for ($i = 1; $i -le 6; $i++) {
            try { Invoke-WebRequest "https://download.microsoft.com/download/9/5/A/95A9616B-7A37-4AF6-BC36-D6EA96C8DAAE/dotnetfx40_Full_x86_x64.exe" -OutFile dist\dotnetfx40_Full_x86_x64.exe -TimeoutSec 300; break }
            catch { Write-Host "download attempt $i failed: $_"; if ($i -eq 6) { throw }; Start-Sleep -Seconds (10 * $i) }
          }
          if ((Get-FileHash dist\dotnetfx40_Full_x86_x64.exe -Algorithm SHA256).Hash -ne "65E064258F2E418816B304F646FF9E87AF101E4C9552AB064BB74D281C38659F") { throw ".NET 4.0 redistributable: unexpected checksum" }
      - name: Install Inno Setup 5.6.1 (next to the Inno Setup 6 of the runner)
        run: |
          for ($i = 1; $i -le 6; $i++) {
            try { Invoke-WebRequest https://files.jrsoftware.org/is/5/innosetup-5.6.1-unicode.exe -OutFile is5.exe -TimeoutSec 60; break }
            catch { Write-Host "download attempt $i failed: $_"; if ($i -eq 6) { throw }; Start-Sleep -Seconds (10 * $i) }
          }
          if ((Get-FileHash is5.exe -Algorithm SHA256).Hash -ne "27D49E9BC769E9D1B214C153011978DB90DC01C2ACD1DDCD9ED7B3FE3B96B538") { throw "Inno Setup 5.6.1: unexpected checksum" }
          Start-Process .\is5.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=C:\InnoSetup5" -Wait
          if (-not (Test-Path C:\InnoSetup5\ISCC.exe)) { throw "Inno Setup 5.6.1 was not installed" }
      - name: Build installer
        run: '& "C:\InnoSetup5\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" windows\installer-legacy.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-windows-x86-legacy
          path: dist/*-setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*-setup.exe

  linux:
    # Self-contained .NET build (Avalonia): .tar.gz, .deb and .AppImage for x64 and arm64. Cross-published on one runner.
    # The published files are also handed to the linux-flatpak job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Test the browser logic
        # Firefox profiles (shared by the Linux, Windows and Windows XP / 7 apps) and how the Linux app finds the browsers; needs no card, no browser, no NSS tools
        run: dotnet run --project tests/BrowserSetup.Tests -c Release
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Build x64 and arm64
        run: |
          export KEEP_PUBLISH=1
          bash scripts/make-linux.sh "${{ steps.ver.outputs.v }}" x64
          bash scripts/make-linux.sh "${{ steps.ver.outputs.v }}" arm64
          tar -C dist -cf dist/linux-publish.tar publish-x64 publish-arm64
      - name: Check the packages
        run: |
          ls dist/SuperCelik-*-linux-x86_64.AppImage dist/SuperCelik-*-linux-aarch64.AppImage
          file dist/SuperCelik-*-linux-x86_64.AppImage dist/SuperCelik-*-linux-aarch64.AppImage
          # unpack the x64 AppImage without FUSE and check its contents
          (cd dist && ./SuperCelik-*-linux-x86_64.AppImage --appimage-extract >/dev/null && test -x squashfs-root/AppRun && test -x squashfs-root/usr/lib/supercelik/SuperCelik && test -f squashfs-root/usr/lib/supercelik/pkcs11/libsrb-id-pkcs11.so && rm -rf squashfs-root)
          dpkg-deb -I dist/SuperCelik-*-linux-amd64.deb
          dpkg-deb -c dist/SuperCelik-*-linux-amd64.deb | grep -E "opt/supercelik/SuperCelik$|opt/supercelik/CA/MUPRootCA4.crt|supercelik.desktop"
          dpkg-deb -c dist/SuperCelik-*-linux-amd64.deb | grep -E "opt/supercelik/pkcs11/libsrb-id-pkcs11.so$"
          dpkg-deb -I dist/SuperCelik-*-linux-amd64.deb | grep -E "Depends:.*pcscd.*libccid.*libnss3-tools"
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/*.manifest.json
            dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-linux-publish
          path: dist/linux-publish.tar
          retention-days: 1
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/*.manifest.json
            dist/*.AppImage
          generate_release_notes: true   # only here: every publishing job appends the notes again, so they used to repeat

  linux-flatpak:
    # Flatpak bundle, built natively on each architecture from the files of the linux job.
    needs: linux
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SuperCelik-linux-publish
          path: dist
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Install flatpak-builder
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build the bundle
        run: |
          tar -C dist -xf dist/linux-publish.tar publish-${{ matrix.arch }}
          bash scripts/make-linux-flatpak.sh "${{ steps.ver.outputs.v }}" ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.flatpak

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          IFS=. read -r MA MI PA <<< "${v%%-*}"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          code=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} )); [ "$code" -ge 1 ] || code=1
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          alias="${KS_ALIAS:-release}"; pass="$KS_PASS"
          if [ -n "$KS_B64" ] && [ -n "$pass" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets: signing with a throwaway key (updates will not install over a previous build)"
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storetype PKCS12 -storepass "$pass" -keypass "$pass" \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Super Celik CI"
          fi
          echo "::add-mask::$pass"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
      - name: Build release APK
        run: |
          gradle -p android assembleRelease --no-daemon -PappVersion=${{ steps.ver.outputs.v }} -PappVersionCode=${{ steps.ver.outputs.code }}
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/SuperCelik-${{ steps.ver.outputs.v }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-android
          path: dist/*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.apk
