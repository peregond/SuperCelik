name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach installers to a release

jobs:
  macos:
    # macOS 26 image: building against the current SDK is what gives the app the current system
    # look (glass toolbar and sidebar) on macOS 26 and later. The app still runs on macOS 13+.
    runs-on: macos-26
    strategy:
      matrix:
        arch: [arm64, x86_64]   # Apple Silicon, Intel
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Build .app and .dmg
        run: bash scripts/make-app.sh "${{ steps.ver.outputs.v }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-macOS-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true

  macos-appstore:
    # Compile and layout check of the Mac App Store variant (sandbox entitlements, no updater); the ad-hoc signed
    # app is not uploadable. The real signed package comes from the "App Store (macOS)" workflow.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build the App Store variant (ad-hoc signed)
        run: UNSIGNED=1 bash scripts/make-appstore-mac.sh 0.0.0 1
      - name: Check the bundle
        run: |
          APP=dist/SuperCelik.app
          codesign -d --entitlements - "$APP" 2>&1 | grep -E "app-sandbox|smartcard"
          test -f "$APP/Contents/PlugIns/SuperCelikToken.appex/Contents/Info.plist"
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :LSApplicationCategoryType" "$APP/Contents/Info.plist"

  ios:
    # Unsigned builds: an .ipa for re-signing and a simulator app that runs on a Mac as is.
    # Installing on an iPhone with working NFC needs the user's own paid Apple Developer team
    # (NFC tag reading is not available to free teams), see ios/README.md.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project ios/SuperCelik.xcodeproj -scheme SuperCelik -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            MARKETING_VERSION="${{ steps.ver.outputs.v }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project ios/SuperCelik.xcodeproj -scheme SuperCelik -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            MARKETING_VERSION="${{ steps.ver.outputs.v }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p dist ios-pkg/Payload
          cp -R build/device/Build/Products/Release-iphoneos/SuperCelik.app ios-pkg/Payload/
          (cd ios-pkg && zip -qry "../dist/SuperCelik-$V-iOS-unsigned.ipa" Payload)
          ditto -c -k --keepParent build/sim/Build/Products/Release-iphonesimulator/SuperCelik.app \
            "dist/SuperCelik-$V-iOS-simulator.zip"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-iOS
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Publish (self-contained, x64)
        run: dotnet publish windows/SerbiaID.Windows -c Release -r win-x64 --self-contained -p:Version=${{ steps.ver.outputs.v }} -o dist/win-x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the smart card minidriver (x64)
        shell: cmd
        run: |
          cl /nologo /O2 /W3 /MT /LD /Fe:dist\win-x64\SuperCelikMD.dll windows\minidriver\scelik_md.c /link /DEF:windows\minidriver\scelik_md.def advapi32.lib winscard.lib bcrypt.lib
          dir dist\win-x64\SuperCelikMD.dll
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-windows-x64
          path: dist/*-setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe
          generate_release_notes: true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          IFS=. read -r MA MI PA <<< "${v%%-*}"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          code=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} )); [ "$code" -ge 1 ] || code=1
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          alias="${KS_ALIAS:-release}"; pass="$KS_PASS"
          if [ -n "$KS_B64" ] && [ -n "$pass" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets: signing with a throwaway key (updates will not install over a previous build)"
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storetype PKCS12 -storepass "$pass" -keypass "$pass" \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Super Celik CI"
          fi
          echo "::add-mask::$pass"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
      - name: Build release APK
        run: |
          gradle -p android assembleRelease --no-daemon -PappVersion=${{ steps.ver.outputs.v }} -PappVersionCode=${{ steps.ver.outputs.code }}
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/SuperCelik-${{ steps.ver.outputs.v }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-android
          path: dist/*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
