name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach installers to a release

jobs:
  macos:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]   # Apple Silicon, Intel
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Build .app and .dmg
        run: bash scripts/make-app.sh "${{ steps.ver.outputs.v }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-macOS-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true

  ios:
    # Compile check only: the build is unsigned. Installing on an iPhone needs the user's own
    # Apple Developer team (NFC tag reading is not available to free teams), see ios/README.md.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/SuperCelik.xcodeproj -scheme SuperCelik -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Publish (self-contained, x64)
        run: dotnet publish windows/SerbiaID.Windows -c Release -r win-x64 --self-contained -p:Version=${{ steps.ver.outputs.v }} -o dist/win-x64
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCelik-windows-x64
          path: dist/*-setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe
          generate_release_notes: true

