name: App Store (iOS / iPadOS)

# Manual: archives the iOS app with Apple's cloud-managed signing and uploads it to App Store Connect (TestFlight).
# Needs an Apple Developer Program team and an App Store Connect API key. Repository secrets:
#   APPLE_TEAM_ID            10-character team id (developer.apple.com > Membership)
#   ASC_KEY_ID               App Store Connect API key id
#   ASC_ISSUER_ID            issuer id (App Store Connect > Users and Access > Integrations)
#   ASC_KEY_P8_BASE64        the AuthKey_XXXX.p8 file, base64 (base64 -w0 AuthKey_XXXX.p8)
# The app record with the bundle id com.peregond.supercelik.ios (or yours, change it in the project) must exist in App Store Connect.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      build:
        description: "Build number (must grow with every upload); empty = run number"
        required: false

jobs:
  upload:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for v in T K I P; do [ -n "${!v}" ] || { echo "::error::Missing repository secret for $v (see the comment at the top of this workflow)"; exit 1; }; done
      - name: App Store Connect API key
        env:
          P: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$P" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          BUILD="${{ github.event.inputs.build }}"; BUILD="${BUILD:-${{ github.run_number }}}"
          xcodebuild archive -project ios/SuperCelik.xcodeproj -scheme SuperCelik -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SuperCelik.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ github.event.inputs.version }}" CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
      - name: Export and upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM" ios/ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SuperCelik.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
